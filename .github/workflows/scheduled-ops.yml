name: Scheduled ops

on:
  schedule:
    # Daily 06:00 UTC — after typical Databricks pipeline window
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  job-spike-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install databricks-sql-connector python-dotenv

      - name: Run job spike check
        env:
          DATABRICKS_HOST: ${{ secrets.DBT_DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TRIAGE_RECIPIENT_EMAIL: ${{ secrets.TRIAGE_RECIPIENT_EMAIL }}
        run: python scripts/job_spike_check.py
