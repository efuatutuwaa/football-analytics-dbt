  - name: int_transfers
    description: >
      One row per player transfer (player_id, new_team_id, transfer_date). Sources: stg_transfers
      (primary). Enriches staging transfer records with business logic classifications. Splits the
      raw transfer_type field — which the API reuses for both the transfer type label and the fee
      amount — into a normalized transfer_type (permanent/loan/loan_return/free/unknown) and
      transfer_fee (the raw monetary string where applicable). Adds transfer_window tagging
      (summer/winter/emergency) based on the month of transfer_date. Materialized as table.
      Applies two data quality filters beyond stg_transfers: (1) excludes records where
      new_team_id is null (free agent releases with no destination club); (2) deduplicates on
      (player_id, new_team_id, transfer_date) — stricter than the staging dedup which includes
      previous_team_id, because the API occasionally records the same transfer twice with
      different previous_team values. Feeds int_player_club_periods and mart_transfer_window.
    columns:
      - name: player_id
        description: Identifier for the player.
        tests:
          - not_null
      - name: player_name
        description: Display name of the player.
      - name: new_team_id
        description: Identifier for the club the player transferred to.
        tests:
          - not_null
      - name: new_team_name
        description: Display name of the destination club.
      - name: previous_team_id
        description: Identifier for the club the player transferred from.
      - name: previous_team_name
        description: Display name of the previous club.
      - name: transfer_date
        description: Date the transfer was completed.
        tests:
          - not_null
      - name: transfer_type
        description: Normalized transfer type — permanent, loan, loan_return, free, or unknown.
        tests:
          - accepted_values:
              values: ['permanent', 'loan', 'loan_return', 'free', 'unknown']
      - name: transfer_fee
        description: Raw fee string from the API (e.g. € 75M). Null for non-fee transfers.
      - name: transfer_window
        description: Transfer window the move occurred in — summer (Jun–Aug), winter (Jan), or emergency.
        tests:
          - accepted_values:
              values: ['summer', 'winter', 'emergency']
      - name: last_updated
        description: Timestamp of the last update from the source API.
      - name: ingested_at
        description: Timestamp when the record was ingested.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - transfer_date
            - new_team_id
            - previous_team_id

