        description: Country the club is based in.
      - name: opponent_team_id
        description: Identifier for the opposing team.
      - name: opponent_team_name
        description: Display name of the opposing team.
      - name: is_home
        description: True if this club played at home.
      - name: is_winner
        description: True if this club won the fixture.
      - name: league_name
        description: Display name of the cup competition.
      - name: league_country
        description: Country the cup belongs to.
      - name: league_season
        description: Season year the cup was played.
        tests:
          - not_null
      - name: season_start_date
        description: Start date of the season.
      - name: season_end_date
        description: End date of the season.
      - name: is_current_season
        description: True if this is the current active season.
      - name: league_round
        description: Cup round label (e.g. Round of 16, Quarter-finals, Final).
        tests:
          - not_null
      - name: round_order
        description: Numeric rank of the round for ordering and window function comparisons.
      - name: is_farthest_round
        description: >
          True for all fixtures in the club's deepest round that season (not only the exit match).
          Requires full table refresh — incremental runs would leave stale true values on earlier rounds.
      - name: match_date
        description: Calendar date of the match.
      - name: match_timestamp
        description: Full UTC timestamp of kick-off.
      - name: first_half_start
        description: Timestamp when the first half kicked off.
      - name: second_half_start
        description: Timestamp when the second half kicked off.
      - name: elapsed_minutes
        description: Minutes elapsed at last update.
      - name: extra_time
        description: Extra time minutes played, if applicable.
      - name: match_duration
        description: Total match duration — elapsed_minutes + coalesce(extra_time, 0).
      - name: match_status_long
        description: Full match status description.
      - name: match_status_short
        description: Short match status code (e.g. FT, NS, Canc).
      - name: match_referee
        description: Name of the match referee.
      - name: timezone
        description: Timezone in which match times are expressed.
      - name: goals_scored
        description: Goals scored by this club at full time.
      - name: goals_conceded
        description: Goals conceded by this club at full time.
      - name: team_halftime_score
        description: Goals scored by this club at half time.
      - name: opponent_halftime_score
        description: Goals scored by the opponent at half time.
      - name: team_extratime_score
        description: Goals scored by this club in extra time (null if no extra time).
      - name: opponent_extratime_score
        description: Goals scored by the opponent in extra time.
      - name: team_penalty_score
        description: Penalty shootout score for this club (null if no shootout).
      - name: opponent_penalty_score
        description: Penalty shootout score for the opponent.
      - name: ingested_at
