semantic_models:
  - name: club_season
    description: Domestic league season summary per club (big-five leagues).
    model: ref('mart_club_season')
    defaults:
      agg_time_dimension: league_season
    entities:
      - name: club
        type: primary
        expr: team_id
      - name: league
        type: foreign
        expr: league_id
    dimensions:
      # API season year (int) → date for MetricFlow agg_time_dimension (year grain)
      - name: league_season
        type: time
        type_params:
          time_granularity: year
        expr: make_date(cast(league_season as int), 1, 1)
        label: Season
      - name: league_name
        type: categorical
        expr: league_name
        label: League
      - name: team_name
        type: categorical
        expr: team_name
        label: Club
    measures:
      - name: matches_played
        agg: sum
        expr: matches_played
        label: Matches played
      - name: league_points
        agg: sum
        expr: league_points
        label: League points
      - name: goals_scored
        agg: sum
        expr: goals_scored
        label: Goals scored
      - name: goals_conceded
        agg: sum
        expr: goals_conceded
        label: Goals conceded
      - name: wins
        agg: sum
        expr: wins
        label: Wins
