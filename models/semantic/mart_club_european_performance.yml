semantic_models:
  - name: club_european_performance
    description: >
      Club season summary per European club tournament (UCL, Club World Cup).
      Grain team_id, league_id, league_season.
    model: ref('mart_club_european_performance')
    defaults:
      agg_time_dimension: european_season
    entities:
      - name: european_club
        type: primary
        expr: team_id
      - name: european_competition
        type: foreign
        expr: league_id
    dimensions:
      - name: european_season
        type: time
        type_params:
          time_granularity: year
        expr: make_date(cast(league_season as int), 1, 1)
        label: Season
      - name: european_competition_name
        type: categorical
        expr: league_name
        label: Competition
      - name: european_club_name
        type: categorical
        expr: team_name
        label: Club
      - name: european_farthest_round
        type: categorical
        expr: farthest_round
        label: Farthest round
      - name: european_was_tournament_winner
        type: categorical
        expr: cast(was_tournament_winner as string)
        label: Tournament winner
    measures:
      - name: european_campaigns
        agg: count
        expr: team_id
        label: Campaigns
      - name: european_matches_played
        agg: sum
        expr: matches_played
        label: Matches played
      - name: european_goals_scored
        agg: sum
        expr: goals_scored
        label: Goals scored
      - name: european_goals_conceded
        agg: sum
        expr: goals_conceded
        label: Goals conceded
      - name: european_wins
        agg: sum
        expr: wins
        label: Wins
      - name: european_tournament_wins
        agg: sum
        expr: cast(was_tournament_winner as int)
        label: Tournament wins
